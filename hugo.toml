baseURL = "https://joshdean814.github.io/"
title = "Josh Dean"
theme = "hugo-theme-cleanwhite"
languageCode = "en-us"
preserveTaxonomyNames = true
hasCJKLanguage = true

[pagination]
  pagerSize = 5 # frontpage pagination

[outputs]
home = ["HTML", "RSS", "Algolia"]

[params]
  header_image = "img/mt_cook_nz.jpeg"
  description = "Josh Dean's Blog"
  SEOTitle = "Blog"
  slogan = "Discovery loading..."
  upstreamAttribution = true

  image_404 = "img/404-bg.jpg"
  title_404 = "Page Not Found :("
  omit_categories = false

  # algolia site search
  algolia_search = true
  algolia_appId = ""
  algolia_indexName = ""
  algolia_apiKey = ""

  # Sidebar settings
  sidebar_about_description = "Embedded Systems Developer, Tinkering Enthusiast and Aspiring Swede"
  sidebar_avatar = "img/josh_profile_pic.jpeg"

  featured_tags = true 
  featured_condition_size = 1 

  friends = false
  bookmarks = false
  about_me = true

  # Last posts
  last_posts = true
  #last_posts_title = "LAST POSTS"
  #last_posts_count = 5

  [params.social]
  rss            = true 
  email          = "josh.dean31@yahoo.com"
  linkedin       = "https://www.linkedin.com/in/josh-dean-05090b243"
  github         = "https://github.com/joshdean814"
  
  [[params.bookmark_link]]
  title =  "Martin Fowler"
  href =  "https://martinfowler.com"
  [[params.bookmark_link]]

  [[params.additional_menus]]
  title =  "ARCHIVE"
  href =  "/archive"
  [[params.additional_menus]]
  title =  "ABOUT"
  href =  "/about"
  [[params.additional_menus]]
  title =  "RESUME"
  href =  "/img/josh_dean_resume.pdf"

[services]
  [services.disqus]
    shortname = "joshdean814-github-io"

disqus_site = "joshdean814-github-io"

[outputFormats.Algolia]
baseName = "algolia"
isPlainText = true
mediaType = "application/json"
notAlternative = true

[params.algolia]
vars = ["title", "summary", "date", "publishdate", "expirydate", "permalink"]
params = ["categories", "tags"] 

[markup]
  [markup.tableOfContents]
    endLevel = 2
    startLevel = 1
  [markup.highlight]
    style = "dracula"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

[mediaTypes]
  [mediaTypes.'font/woff']
    suffixes = ['woff']
  [mediaTypes.'font/woff2']
    suffixes = ['woff2']